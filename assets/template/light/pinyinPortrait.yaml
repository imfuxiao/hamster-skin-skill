# =============================================================================
# 元书输入法皮肤模板 —— iPhone 竖屏 26 键拼音键盘
#
# 改配色：只改下面「调色板」中的值即可整体换肤。
# 改布局：改 keyboardLayout（HStack = 行，Cell = 键）。
# 校验：  ruby scripts/validate_skin.rb <皮肤目录>
# =============================================================================

# ---- 调色板（这是一个惰性根节点，不会被引用，仅用于集中定义 YAML 锚点）----
_palette:
  keyboardBg:   &cKeyboardBg   "#D1D4DA"   # 键盘底色
  letterBg:     &cLetterBg     "#FFFFFF"   # 字母键底色
  letterBgDown: &cLetterBgDown "#E6E6E6"   # 字母键按下底色
  systemBg:     &cSystemBg     "#ADB3BE"   # 功能键底色
  systemBgDown: &cSystemBgDown "#FFFFFF"   # 功能键按下底色
  accentBg:     &cAccentBg     "#0A84FF"   # 强调键（回车）底色
  edge:         &cEdge         "#898A8D"   # 按键下边缘阴影色
  text:         &cText         "#000000"   # 主文字色
  textOnAccent: &cTextOnAccent "#FFFFFF"   # 强调键上的文字色
  candidate:    &cCandidate    "#000000"   # 候选字颜色
  comment:      &cComment      "#8E8E93"   # 候选字注释颜色

# ---- 三个区域的高度（必填）----
preeditHeight: 25
toolbarHeight: 40
keyboardHeight: 216

# ---- 预编辑区 ----
preeditStyle:
  backgroundStyle: keyboardBackgroundStyle
  foregroundStyle: preeditForegroundStyle
  insets: { top: 2, left: 6 }
preeditForegroundStyle:
  fontSize: 14
  textColor: *cText

# ---- 工具栏区（非输入态显示；输入态会被候选栏覆盖）----
toolbarStyle:
  backgroundStyle: keyboardBackgroundStyle
toolbarLayout: {}

# ---- 横向候选栏（输入态覆盖工具栏区）----
horizontalCandidatesStyle:
  backgroundStyle: keyboardBackgroundStyle
  insets: { top: 4, left: 4, bottom: 2 }
horizontalCandidatesLayout:
  - HStack:
      subviews:
        - Cell: horizontalCandidatesCell
        - Cell: expandButton
horizontalCandidatesCell:
  type: horizontalCandidates
  candidateStyle: candidateCellStyle
  maxColumns: 7
expandButton:
  size: { width: 44 }
  action: { shortcut: "#candidatesBarStateToggle" }
  foregroundStyle: expandButtonForegroundStyle
expandButtonForegroundStyle:
  buttonStyleType: systemImage
  systemImageName: chevron.down
  fontSize: 14
  normalColor: *cText
  highlightColor: *cText

# ---- 纵向候选栏（展开态，覆盖预编辑区以下全部区域）----
verticalCandidatesStyle:
  backgroundStyle: keyboardBackgroundStyle
  insets: { top: 4, left: 4, right: 4 }
verticalCandidatesLayout:
  - HStack:
      subviews:
        - Cell: verticalCandidatesCell
verticalCandidatesCell:
  type: verticalCandidates
  candidateStyle: candidateCellStyle
  maxRows: 4
  maxColumns: 5
  separatorColor: "#C8C9CC"

# ---- 候选字单元格样式（横向 / 纵向共用）----
candidateCellStyle:
  insets: { top: 2, left: 6, bottom: 2, right: 6 }
  textFontSize: 18
  commentFontSize: 12
  indexFontSize: 12
  textColor: *cCandidate
  commentColor: *cComment
  indexColor: *cComment
  preferredTextColor: *cCandidate
  preferredCommentColor: *cComment
  preferredIndexColor: *cComment
  highlightBackgroundColor: "#00000014"
  backgroundCornerRadius: 6

# ---- 长按候选字的上下文菜单 ----
candidateContextMenu:
  - { name: 复制, action: { shortcut: "#copy" } }

# ---- 按键区 ----
keyboardStyle:
  backgroundStyle: keyboardBackgroundStyle
keyboardLayout:
  - HStack:
      subviews:
        - Cell: qButton
        - Cell: wButton
        - Cell: eButton
        - Cell: rButton
        - Cell: tButton
        - Cell: yButton
        - Cell: uButton
        - Cell: iButton
        - Cell: oButton
        - Cell: pButton
  - HStack:
      subviews:
        - Cell: aButton
        - Cell: sButton
        - Cell: dButton
        - Cell: fButton
        - Cell: gButton
        - Cell: hButton
        - Cell: jButton
        - Cell: kButton
        - Cell: lButton
  - HStack:
      subviews:
        - Cell: shiftButton
        - Cell: zButton
        - Cell: xButton
        - Cell: cButton
        - Cell: vButton
        - Cell: bButton
        - Cell: nButton
        - Cell: mButton
        - Cell: backspaceButton
  - HStack:
      subviews:
        - Cell: numericButton
        - Cell: spaceButton
        - Cell: enterButton

# =============================================================================
# 共用样式
# =============================================================================

keyboardBackgroundStyle:
  buttonStyleType: geometry
  normalColor: *cKeyboardBg
  highlightColor: *cKeyboardBg

letterButtonBackgroundStyle:
  buttonStyleType: geometry
  insets: { top: 4, left: 3, bottom: 4, right: 3 }
  cornerRadius: 8.5
  normalColor: *cLetterBg
  highlightColor: *cLetterBgDown
  normalLowerEdgeColor: *cEdge
  highlightLowerEdgeColor: *cEdge

systemButtonBackgroundStyle:
  buttonStyleType: geometry
  insets: { top: 4, left: 3, bottom: 4, right: 3 }
  cornerRadius: 8.5
  normalColor: *cSystemBg
  highlightColor: *cSystemBgDown
  normalLowerEdgeColor: *cEdge
  highlightLowerEdgeColor: *cEdge

accentButtonBackgroundStyle:
  buttonStyleType: geometry
  insets: { top: 4, left: 3, bottom: 4, right: 3 }
  cornerRadius: 8.5
  normalColor: *cAccentBg
  highlightColor: *cSystemBgDown
  normalLowerEdgeColor: *cEdge
  highlightLowerEdgeColor: *cEdge

hintBackgroundStyle:
  buttonStyleType: geometry
  cornerRadius: 8
  normalColor: *cLetterBg
  highlightColor: *cLetterBg
  normalShadowColor: "#00000040"
  shadowRadius: 4
  shadowOffset: { x: 0, y: 2 }

# ---- 供字母按键 merge 的基底（注意：这里只能放通过 getNode 读取的 Key）----
_base:
  letterKey: &letterKey
    backgroundStyle: letterButtonBackgroundStyle
  letterFg: &letterFg
    buttonStyleType: text
    fontSize: 22.5
    normalColor: *cText
    highlightColor: *cText
  hintBase: &hintBase
    size: { width: 1/9, height: 1/4 }
    backgroundStyle: hintBackgroundStyle
  hintFg: &hintFg
    buttonStyleType: text
    fontSize: 28
    normalColor: *cText
    highlightColor: *cText

# ---- 26 个字母按键 ----
qButton: { <<: *letterKey, size: { width: 112.5/1125 }, action: { character: q }, uppercasedStateAction: { character: Q }, foregroundStyle: qFg, uppercasedStateForegroundStyle: qUpFg, hintStyle: qHint }
wButton: { <<: *letterKey, size: { width: 112.5/1125 }, action: { character: w }, uppercasedStateAction: { character: W }, foregroundStyle: wFg, uppercasedStateForegroundStyle: wUpFg, hintStyle: wHint }
