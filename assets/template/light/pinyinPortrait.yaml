# ---- 功能按键 ----
shiftButton:
  size: { width: 168.75/1125 }
  bounds: { alignment: left, width: 151/168.75 }
  action: shift
  backgroundStyle: systemButtonBackgroundStyle
  foregroundStyle: shiftButtonForegroundStyle
  uppercasedStateForegroundStyle: shiftButtonUppercasedForegroundStyle
  capsLockedStateForegroundStyle: shiftButtonCapsLockedForegroundStyle
shiftButtonForegroundStyle:
  buttonStyleType: systemImage
  systemImageName: shift
  fontSize: 18
  normalColor: *cText
  highlightColor: *cText
shiftButtonUppercasedForegroundStyle:
  buttonStyleType: systemImage
  systemImageName: shift.fill
  fontSize: 18
  normalColor: *cText
  highlightColor: *cText
shiftButtonCapsLockedForegroundStyle:
  buttonStyleType: systemImage
  systemImageName: capslock.fill
  fontSize: 18
  normalColor: *cText
  highlightColor: *cText

backspaceButton:
  size: { width: 168.75/1125 }
  bounds: { alignment: right, width: 151/168.75 }
  action: backspace
  repeatAction: backspace
  backgroundStyle: systemButtonBackgroundStyle
  foregroundStyle: backspaceButtonForegroundStyle
backspaceButtonForegroundStyle:
  buttonStyleType: systemImage
  systemImageName: delete.left
  fontSize: 18
  normalColor: *cText
  highlightColor: *cText

numericButton:
  size: { width: 280/1125 }
  action: { keyboardType: numeric }
  backgroundStyle: systemButtonBackgroundStyle
  foregroundStyle: numericButtonForegroundStyle
numericButtonForegroundStyle:
  buttonStyleType: text
  text: "123"
  fontSize: 16
  normalColor: *cText
  highlightColor: *cText

spaceButton:
  action: space
  backgroundStyle: letterButtonBackgroundStyle
  foregroundStyle: spaceButtonForegroundStyle
  swipeUpAction: { shortcut: "#次选上屏" }
spaceButtonForegroundStyle:
  buttonStyleType: text
  text: "$rimeSchemaName"
  fontSize: 14
  normalColor: *cText
  highlightColor: *cText

enterButton:
  size: { width: 280/1125 }
  action: enter
  backgroundStyle: accentButtonBackgroundStyle
  foregroundStyle: enterButtonForegroundStyle
enterButtonForegroundStyle:
  buttonStyleType: text
  text: "$returnKeyType"
  fontSize: 16
  normalColor: *cTextOnAccent
  highlightColor: *cText
